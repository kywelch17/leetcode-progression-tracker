spring.application.name=leetcode-progression-tracker

spring.datasource.url=jdbc:h2:mem:leetcodeprogressiontracker
spring.datasource.username=dbuser
spring.datasource.password=dbpassword

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1

logging.level.com.kylewelch.leetcode_progression_tracker=INFO
logging.level.org.springframework.jdbc.datasource.init=DEBUG